name: "CI"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  # push 이벤트가 유실돼 배포가 안 나가는 일이 형제 프로젝트에서 있었다.
  # 같은 파이프라인을 손으로 다시 돌릴 수 있게 열어둔다.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # .python-version 파일이 없다. Dockerfile 의 python:3.11-slim 과 맞춘다 -
      # 여기서 갈라지면 CI 는 통과하는데 컨테이너에서 죽는 코드가 새어 나간다.
      - name: "Setup Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 앱은 표준 라이브러리만 쓴다(requirements.txt 가 없는 이유). 검사 도구만 받는다.
      # 버전을 고정하지 않는 대신 규칙을 ruff.toml 에 적어 뒀다 - 기본 규칙 집합은
      # ruff 버전마다 달라서, 그것만 믿으면 코드를 하나도 안 고쳤는데 어느 날
      # 빨간불이 된다(첫 배포가 정확히 그렇게 깨졌다).
      - name: "Install tooling"
        run: pip install ruff pytest

      - name: "Ruff lint"
        run: ruff check .

      # 테스트는 stdlib unittest 로 쓰였고 pytest 가 그대로 수집한다.
      # DB·관리자 비밀번호는 test_notice_api.py 가 import 시점에 임시값으로 잡으므로
      # .env 없이 돈다.
      - name: "Pytest"
        run: pytest -q

  deploy:
    needs: [test]
    # workflow_dispatch 도 배포까지 간다. push 만 허용하면 위에서 열어 둔 수동
    # 재실행이 test 만 돌고 끝나, 정작 배포가 안 나갔을 때 쓸 수가 없다.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # 이 저장소에 등록된 repo 스코프 러너다(measly-home,
    # /home/measly/actions-runner-home). 라벨을 다른 프로젝트 것으로 두면 남의
    # 디렉토리를 배포하게 되므로 반드시 home 이어야 한다.
    runs-on: [self-hosted, home]
    timeout-minutes: 10
    # 푸시가 연달아 나면 뒤엣것이 앞엣것의 rebuild 중간에 컨테이너를 갈아끼운다.
    concurrency:
      group: deploy-home
      cancel-in-progress: false

    steps:
      # self-hosted 러너가 /home/measly/home 에서 도는 컨테이너와 같은 서버에 있다 -
      # actions/checkout 으로 별도 워크스페이스에 받지 않고 배포용 클론 디렉토리를
      # 직접 최신화한다 (.env 와 notices 볼륨이 거기 붙어 있다).
      - name: "Deploy (pull + rebuild + restart)"
        run: |
          set -euo pipefail
          cd /home/measly/home

          # 추적 중인 파일에 손댄 게 남아 있으면 여기서 멈춘다. 그대로 두면 두 가지로
          # 샌다 - pull 이 그 파일에서 충돌해 죽거나(그때 에러가 원인을 안 알려준다),
          # 충돌을 피해 pull 이 통과하면 main 에 없는 코드가 이미지에 섞여 들어간다.
          # 실제로 배포 디렉토리의 nginx 설정이 이 상태로 방치돼 있었다(2026-08-29).
          dirty=$(git status --porcelain --untracked-files=no)
          if [ -n "$dirty" ]; then
            echo "배포 디렉토리에 커밋되지 않은 변경이 있다. 커밋하거나 되돌린 뒤 다시 돌려라:"
            echo "$dirty"
            exit 1
          fi

          git fetch origin main
          git pull --ff-only origin main
          docker compose build web
          docker compose up -d web

      # 깨진 배포에 초록불이 나가지 않게 한다. 자산을 **실제로 GET 해서** 200 을
      # 본다 - HTML 안의 경로만 grep 하면 파일이 없어도 통과한다. .dockerignore 에
      # *.png 가 있어서 특히 그렇다(지금은 루트 레벨만 매치돼 assets/ 밑은 살아
      # 있지만, 패턴이 **/*.png 로 바뀌는 순간 아이콘이 통째로 사라진다).
      - name: "Verify"
        run: |
          set -euo pipefail
          base=http://localhost:8022

          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/" || true)
            [ "$code" = "200" ] && break
            [ "$i" = "15" ] && { echo "/ 가 200 이 아니다: $code"; exit 1; }
            sleep 2
          done

          # 공지 API 와 페이지도 함께 본다. 정적 index.html 만 살아 있고 서버 코드가
          # 죽은 배포를 걸러낸다.
          for p in / /notice /api/notices; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$code  $p"
            [ "$code" = "200" ] || { echo "$p 가 200 이 아니다"; exit 1; }
          done

          html=$(curl -fsS "$base/")
          assets=$(printf '%s' "$html" | grep -oE '(href|src)="/?assets/[A-Za-z0-9_./-]+"' \
                   | sed -E 's/^[a-z]+="\/?/\//; s/"$//' | sort -u)
          [ -n "$assets" ] || { echo "index.html 에서 자산 경로를 못 찾았다"; exit 1; }

          for a in $assets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$a")
            echo "$code  $a"
            [ "$code" = "200" ] || { echo "자산이 200 이 아니다"; exit 1; }
          done
