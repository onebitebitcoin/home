<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지 작성 - 한입 비트코인</title>
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<meta name="description" content="한입 비트코인 공지 작성">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://onebitebitcoin.com/notice">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onebitebitcoin.com/notice">
<meta property="og:site_name" content="한입 비트코인">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="공지 작성 - 한입 비트코인">
<meta property="og:description" content="한입 비트코인 공지 작성">
<meta property="og:image" content="https://onebitebitcoin.com/assets/og/onebite-logo.jpg">
<link rel="stylesheet" href="/assets/notice.css">
</head>
<body>
<div class="bg"></div>
<div class="page">
  <header class="page-header">
    <nav class="breadcrumb" aria-label="이동 경로">
      <a href="/">한입 비트코인</a>
      <span aria-hidden="true">&rsaquo;</span>
      <a href="/notice">공지사항</a>
    </nav>
  </header>

  <h1 class="page-title" id="form-title">공지 작성</h1>

  <div class="state-msg" id="state-msg" hidden></div>

  <form class="notice-form" id="notice-form">
    <label class="form-label" for="notice-title-input">제목</label>
    <input type="text" id="notice-title-input" maxlength="200" required>
    <span class="char-count" id="title-char-count">0 / 200</span>

    <label class="form-label" for="notice-body-input">내용</label>
    <textarea id="notice-body-input" maxlength="10000" required></textarea>
    <span class="char-count" id="body-char-count">0 / 10000</span>

    <div class="form-actions">
      <button type="button" class="btn btn-ghost" id="btn-cancel">취소</button>
      <button type="submit" class="btn btn-primary" id="btn-submit">저장</button>
    </div>
  </form>
</div>
<script src="/assets/notice.js" defer></script>
<script src="/assets/notice-form.js" defer></script>
</body>
</html>
