# onebitebitcoin.com - 홈 대시보드(home) 인그레스
#
# 이 파일은 "호스트 시스템 nginx"(/etc/nginx)용이다. 역할은 TLS 종단과
# 127.0.0.1:8022 프록시 두 가지뿐이다. 정적 서빙, 공지 API, /api 프록시는
# 전부 컨테이너 안의 server.py 가 처리한다.
#
# 설치는 DEPLOY.md 4절을 따른다. 인증서가 없는 상태로 :443 블록을 넣으면
# nginx -t 가 깨지므로 bootstrap.conf 로 한 번 나눠 올려야 한다.
#
# 이 도메인은 apex 다. 같은 존의 서브도메인(daily/fee/meet ...)은 각자
# 별도 vhost 를 갖고 있으므로 이 파일이 그쪽에 영향을 주지 않는다.

server {
    listen 80;
    listen [::]:80;
    server_name onebitebitcoin.com www.onebitebitcoin.com;

    location ~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onebitebitcoin.com www.onebitebitcoin.com;

    access_log /var/log/nginx/onebitebitcoin.com.access.log;
    error_log /var/log/nginx/onebitebitcoin.com.error.log;

    ssl_certificate /etc/letsencrypt/live/onebitebitcoin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onebitebitcoin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 공지 본문 상한이 10,000자라 기본 1M 로 충분하다. 여유만 둔다.
    client_max_body_size 2M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 앱이 이 헤더의 첫 항목을 클라이언트 IP 로 읽어 레이트 리밋을 건다
        # (TRUST_PROXY=1 일 때만). Cloudflare 가 앞에 있으면 CF 가 실제
        # 클라이언트를 첫 항목으로 넣고, nginx 가 CF 주소를 뒤에 덧붙인다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        # 시세 프록시(/api/v1/...)가 업스트림을 기다리는 시간을 감안한다.
        # 앱 쪽 urlopen 타임아웃이 10초라 그보다 넉넉히 잡는다.
        proxy_read_timeout 30s;
    }
}
