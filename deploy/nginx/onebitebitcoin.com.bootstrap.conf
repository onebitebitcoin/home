# 부트스트랩용 :80 전용 vhost - 최초 인증서 발급 때만 쓴다.
#
# 인증서가 없는 상태에서 onebitebitcoin.com.conf(:443 포함)를 넣으면
# ssl_certificate 경로가 없어 `nginx -t` 가 실패한다. 그래서 이 파일로 :80 만
# 먼저 올려 ACME 챌린지를 받게 한 뒤, 발급이 끝나면 전체 conf 로 교체한다.
#
#   sudo cp deploy/nginx/onebitebitcoin.com.bootstrap.conf \
#           /etc/nginx/sites-available/onebitebitcoin.com
#   sudo ln -sf /etc/nginx/sites-available/onebitebitcoin.com \
#               /etc/nginx/sites-enabled/onebitebitcoin.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name onebitebitcoin.com;

    # certbot --webroot 챌린지. 리다이렉트보다 먼저 매치되어야 한다.
    location ~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
