<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 - 한입 비트코인</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/icons/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<meta name="description" content="한입 비트코인 공지사항">
<link rel="canonical" href="https://onebitebitcoin.com/notice">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onebitebitcoin.com/notice">
<meta property="og:site_name" content="한입 비트코인">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="공지사항 - 한입 비트코인">
<meta property="og:description" content="한입 비트코인 공지사항">
<meta property="og:image" content="https://onebitebitcoin.com/assets/og/onebite-logo.jpg">
<link rel="stylesheet" href="/assets/notice.css">
</head>
<body>
<div class="bg"></div>
<div class="page">
  <header class="page-header">
    <nav class="breadcrumb" aria-label="이동 경로">
      <a href="/">한입 비트코인</a>
      <span aria-hidden="true">&rsaquo;</span>
      <span>공지사항</span>
    </nav>
    <div class="header-actions" id="header-actions"></div>
  </header>

  <h1 class="page-title">공지사항</h1>

  <!-- 관리자 로그인 폼: '관리자' 버튼을 누르면 펼쳐진다 -->
  <form class="admin-login" id="admin-login" hidden>
    <div class="admin-login-row">
      <input type="password" id="admin-password" placeholder="관리자 비밀번호" maxlength="64" autocomplete="off">
      <button type="button" class="btn btn-primary" id="admin-login-submit">확인</button>
      <button type="button" class="btn btn-ghost" id="admin-login-cancel">취소</button>
    </div>
    <div class="admin-login-msg" id="admin-login-msg" hidden></div>
  </form>

  <div class="state-msg" id="state-msg" hidden></div>

  <ul class="notice-list" id="notice-list"></ul>

  <nav class="pagination" id="pagination" aria-label="페이지 네비게이션" hidden></nav>
</div>
<script src="/assets/notice.js" defer></script>
<script src="/assets/notice-list.js" defer></script>
</body>
</html>
