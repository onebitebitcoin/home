<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="오늘의 비트코인 뉴스 로고">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7931A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7C2D12" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="132" y="108" width="248" height="296" rx="34" fill="#FFF7ED"/>
    <rect x="160" y="140" width="148" height="20" rx="10" fill="#F7931A"/>
    <rect x="160" y="172" width="190" height="16" rx="8" fill="#FDBA74"/>
    <!-- ₿ 는 카드의 주역이라 크게 하나만 둔다. 이전 판은 원 안에 작게 넣고
         위아래 볼록이 2단위 겹쳐 있어서 76px 로 줄면 한 덩어리로 뭉갰다.
         원을 빼고 볼록 사이를 18단위 벌렸다. 세로 획(₿ 를 B 와 가르는 부분)은
         본기둥과 같은 28단위 두께로 뽑아야 그 크기에서 살아남는다. -->
    <g fill="#F7931A">
      <rect x="200" y="212" width="28" height="184"/>
      <rect x="252" y="212" width="28" height="26"/>
      <rect x="252" y="370" width="28" height="26"/>
      <path d="M220 236h54a29 29 0 0 1 0 58h-54z"/>
      <path d="M220 312h60a31 31 0 0 1 0 62h-60z"/>
    </g>
  </g>
</svg>
